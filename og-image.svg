<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background navy -->
  <rect width="1200" height="630" fill="#0f2b5b"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1a3a70" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1a3a70" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1a3a70" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1a3a70" stroke-width="1"/>
  <!-- Shield icon (left) -->
  <g transform="translate(140, 215)">
    <path d="M100 0 L200 40 L200 120 C200 165 155 200 100 215 C45 200 0 165 0 120 L0 40 Z" fill="#ffffff" opacity="0.12"/>
    <path d="M100 15 L185 50 L185 120 C185 158 145 188 100 200 C55 188 15 158 15 120 L15 50 Z" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
    <!-- i dot -->
    <circle cx="100" cy="80" r="14" fill="#ffffff"/>
    <!-- i stem -->
    <rect x="88" y="103" width="24" height="70" rx="8" fill="#ffffff"/>
  </g>
  <!-- Main title -->
  <text x="420" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="700" fill="#ffffff" letter-spacing="-2">Info-Score</text>
  <!-- Separator line -->
  <rect x="420" y="310" width="680" height="3" fill="#ffffff" opacity="0.3"/>
  <!-- Subtitle -->
  <text x="420" y="370" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#ffffff" opacity="0.85" letter-spacing="0.5">Certification de la qualité informationnelle</text>
  <!-- Grade badges -->
  <g transform="translate(420, 410)">
    <rect width="60" height="32" rx="6" fill="#1a6b3a"/>
    <text x="30" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">A</text>
  </g>
  <g transform="translate(492, 410)">
    <rect width="60" height="32" rx="6" fill="#1a4a6b"/>
    <text x="30" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#60a5fa" text-anchor="middle">B</text>
  </g>
  <g transform="translate(564, 410)">
    <rect width="60" height="32" rx="6" fill="#4b4b1a"/>
    <text x="30" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fbbf24" text-anchor="middle">C</text>
  </g>
  <g transform="translate(636, 410)">
    <rect width="60" height="32" rx="6" fill="#6b1a1a"/>
    <text x="30" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f87171" text-anchor="middle">D</text>
  </g>
  <!-- Bottom tagline -->
  <text x="600" y="570" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" opacity="0.45" text-anchor="middle" letter-spacing="3">info-score.org · Association loi 1901</text>
</svg>
